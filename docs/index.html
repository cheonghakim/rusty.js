<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusty Playground</title>
<meta name="description" content="Rusty가 잡아내는 소유권 버그를 한 줄씩 실행하며 확인하는 데모.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f1efe9;
    --surface: #ffffff;
    --surface-2: #f7f5f0;
    --text: #1c1a16;
    --text-muted: #756e5e;
    --border: #ddd8ca;
    --border-strong: #c7c0ac;
    --accent: #b8481f;
    --owned: #3b6e8f;
    --ref: #a8791f;
    --mut: #c2541f;
    --moved: #a13a2e;
    --alias: #86806f;

    --term-bg: #17140f;
    --term-text: #e8e3d8;
    --term-dim: #948c78;
    --term-red: #ff6b57;
    --term-amber: #f0b429;
    --term-blue: #7fb3d5;

    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    --font-sans: "IBM Plex Sans", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171510;
      --surface: #201d17;
      --surface-2: #262219;
      --text: #e9e4d8;
      --text-muted: #a29a86;
      --border: #383222;
      --border-strong: #48412c;
      --accent: #e07a45;
      --owned: #7fb3d5;
      --ref: #dcab4c;
      --mut: #e2874f;
      --moved: #e2665a;
      --alias: #9a927d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171510;
    --surface: #201d17;
    --surface-2: #262219;
    --text: #e9e4d8;
    --text-muted: #a29a86;
    --border: #383222;
    --border-strong: #48412c;
    --accent: #e07a45;
    --owned: #7fb3d5;
    --ref: #dcab4c;
    --mut: #e2874f;
    --moved: #e2665a;
    --alias: #9a927d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2.6rem 1.5rem 4rem;
  }

  /* ---------- Header ---------- */
  header { margin-bottom: 2rem; }
  .brand {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0 0 0.4rem;
  }
  .brand .name { color: var(--text); }
  header .tagline {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  header .tagline .prims {
    font-family: var(--font-mono);
    font-size: 0.86rem;
  }

  /* ---------- Playground shell ---------- */
  .playground {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .tabs {
    display: flex;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.88rem;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    border-bottom: 2px solid transparent;
    padding: 0.7rem 1rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected="true"] {
    color: var(--text);
    background: var(--surface);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .stage {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
  }
  @media (max-width: 700px) {
    .stage { grid-template-columns: 1fr; }
  }

  /* ---------- Code panel ---------- */
  .code-panel { padding: 1.1rem 1.1rem 0.3rem; border-right: 1px solid var(--border); }
  .code {
    font-family: var(--font-mono);
    font-size: 0.92rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .line {
    display: grid;
    grid-template-columns: 1.5rem 1.2rem 1fr;
    align-items: baseline;
    padding: 0.3rem 0.6rem;
    border-left: 3px solid transparent;
  }
  .line .num { color: var(--text-muted); opacity: 0.55; font-size: 0.8rem; text-align: right; padding-right: 0.5rem; font-variant-numeric: tabular-nums; }
  .line .gutter { text-align: center; font-size: 0.78rem; color: var(--accent); }
  .line .code-text { white-space: pre; overflow-x: auto; }
  .line.is-active { background: color-mix(in srgb, var(--owned) 10%, transparent); border-left-color: var(--owned); }
  .line.is-error { background: color-mix(in srgb, var(--moved) 14%, transparent); border-left-color: var(--moved); }
  .line.is-related { background: color-mix(in srgb, var(--ref) 12%, transparent); border-left-color: var(--ref); }

  .kw { color: var(--alias); }
  .str { color: var(--owned); }
  .fn-ref { color: var(--ref); font-weight: 600; }
  .fn-mut { color: var(--mut); font-weight: 600; }
  .fn-move { color: var(--moved); font-weight: 600; }

  .is-error .tok-flag, .is-related .tok-flag {
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  .is-error .tok-flag { text-decoration: underline wavy var(--moved); }
  .is-related .tok-flag { text-decoration: underline wavy var(--ref); }

  .narration {
    margin: 0.6rem 0 0;
    font-family: var(--font-mono);
    font-size: 0.83rem;
    color: var(--text-muted);
    min-height: 1.4em;
  }
  .narration.is-error { color: var(--moved); }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.8rem 0;
    flex-wrap: wrap;
  }
  .btn {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.83rem;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 0.42rem 0.7rem;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff8f0; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dots { display: flex; gap: 0.3rem; margin-left: auto; }
  .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--border-strong); border: none; cursor: pointer; padding: 0;
  }
  .dot[aria-current="true"] { background: var(--accent); }

  /* ---------- State panel ---------- */
  .state-panel { padding: 1.1rem; background: var(--surface-2); display: flex; flex-direction: column; gap: 0.6rem; }
  .state-panel h2 {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0;
    font-weight: 500;
  }
  .empty-hint { color: var(--text-muted); font-size: 0.85rem; }
  .var-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.7rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .var-name { font-family: var(--font-mono); font-weight: 600; font-size: 0.92rem; }
  .pill {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    color: #fff;
    white-space: nowrap;
  }

  /* ---------- Terminal / diagnostic ---------- */
  .terminal-wrap { grid-column: 1 / -1; border-top: 1px solid var(--border); }
  .terminal {
    background: var(--term-bg);
    color: var(--term-text);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    padding: 1rem 1.1rem 1.1rem;
  }
  .terminal .head { display: flex; align-items: center; gap: 0.5rem; color: var(--term-red); font-weight: 600; margin-bottom: 0.6rem; }
  .terminal .head .dot3 { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--term-red); display: inline-block; }
  .terminal pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--term-dim); }
  .terminal pre .msg-line { color: var(--term-text); }
  .terminal pre .caret-line { color: var(--term-red); }
  .terminal .note { margin-top: 0.8rem; color: var(--term-amber); }
  .terminal .note pre { color: var(--term-dim); }
  .terminal .note pre .caret-line { color: var(--term-amber); }
  .terminal .help { margin-top: 0.8rem; color: var(--term-blue); }
  .terminal .help ul { margin: 0.3rem 0 0; padding-left: 1.1rem; color: var(--term-text); }
  .terminal .help li { margin-bottom: 0.15rem; }
  .terminal .runtime-note {
    margin-top: 0.8rem;
    color: var(--term-dim);
    font-size: 0.78rem;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    font-family: var(--font-mono);
    font-size: 0.83rem;
  }
  footer .install { color: var(--text-muted); }
  footer .install b { color: var(--text); font-weight: 500; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">🦀 <span class="name">rusty</span></p>
    <p class="tagline">JS 값의 소유권을 정적으로 추적합니다 — <span class="prims">ref · mut · move · clone</span></p>
  </header>

  <section class="playground" aria-label="Rusty 데모">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="stage">
      <div class="code-panel">
        <div class="code" id="code" role="group" aria-label="예제 코드"></div>
        <p class="narration" id="narration"></p>
        <div class="controls">
          <button class="btn" id="btn-reset" title="처음으로">↺</button>
          <button class="btn" id="btn-prev">◀</button>
          <button class="btn primary" id="btn-next">다음</button>
          <button class="btn" id="btn-play">▶</button>
          <div class="dots" id="dots"></div>
        </div>
      </div>
      <div class="state-panel">
        <h2>상태</h2>
        <div id="vars"></div>
      </div>
      <div class="terminal-wrap" id="terminal-wrap" hidden>
        <div class="terminal" id="terminal"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="install"><b>npm i</b> @cheonghakim/rusty.js</div>
    <div>
      <a href="https://www.npmjs.com/package/@cheonghakim/rusty.js" target="_blank" rel="noopener">npm</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/cheonghakim/rusty.js" target="_blank" rel="noopener">github</a>
    </div>
  </footer>
</main>

<script>
(() => {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function caretBlock(lineNum, rawLine, token, tail) {
    const prefix = String(lineNum).padStart(3, " ") + " | ";
    const idx = token ? rawLine.indexOf(token) : -1;
    const codeLine = `${prefix}${rawLine}`;
    if (idx < 0) return `<span>${esc(codeLine)}</span>`;
    const caretLine = " ".repeat(prefix.length + idx) + "^".repeat(token.length) + (tail ? " " + tail : "");
    return `<span>${esc(codeLine)}</span>\n<span class="caret-line">${esc(caretLine)}</span>`;
  }

  const SCENARIOS = [
    {
      id: "move",
      label: "이동 후 사용",
      rule: "rusty/use-after-move",
      raw: [
        `const user = { name: "Summer", age: 30 };`,
        `send(move(user));`,
        `console.log(user.name);`,
      ],
      html: [
        `<span class="kw">const</span> user = { name: <span class="str">"Summer"</span>, age: 30 };`,
        `send(<span class="fn-move tok-flag">move</span>(<span class="tok-flag">user</span>));`,
        `console.log(<span class="tok-flag">user</span>.name);`,
      ],
      steps: [
        { active: -1, vars: [], note: "실행 전" },
        { active: 0, vars: [{ n: "user", s: "owned" }], note: "user 소유" },
        { active: 1, vars: [{ n: "user", s: "moved" }], note: "move(user) → user 이동됨" },
        { active: 2, vars: [{ n: "user", s: "moved" }], note: "⛔ user 재사용 — 이동된 값", isErrorNote: true,
          error: {
            code: "rusty/use-after-move",
            message: "`user` 이미 이동되어 더 이상 사용할 수 없습니다.",
            errorLine: 3, errorToken: "user",
            relatedLine: 2, relatedToken: "move", relatedLabel: "`user` 이동된 지점",
            fixes: [
              "읽기만 한다면: ref(user)로 전달하세요",
              "일시적으로 수정한다면: mut(user)로 전달하세요",
              "소유권이 꼭 필요하다면: move(clone(user))으로 전달하세요",
            ],
          } },
      ],
    },
    {
      id: "ref",
      label: "참조 중 수정",
      rule: "rusty/mutation-through-ref",
      raw: [
        `const cart = { id: "C-1", amount: 200 };`,
        `const cartRef = ref(cart);`,
        `cart.amount = 999;`,
        `console.log(cartRef.amount);`,
      ],
      html: [
        `<span class="kw">const</span> cart = { id: <span class="str">"C-1"</span>, amount: 200 };`,
        `<span class="kw">const</span> cartRef = <span class="fn-ref tok-flag">ref</span>(<span class="tok-flag">cart</span>);`,
        `<span class="tok-flag">cart</span>.amount = 999;`,
        `console.log(cartRef.amount);`,
      ],
      steps: [
        { active: -1, vars: [], note: "실행 전" },
        { active: 0, vars: [{ n: "cart", s: "owned" }], note: "cart 소유" },
        { active: 1, vars: [{ n: "cart", s: "ref" }, { n: "cartRef", s: "alias" }], note: "ref(cart) → cart 읽기 대여" },
        { active: 2, vars: [{ n: "cart", s: "ref" }, { n: "cartRef", s: "alias" }], note: "⛔ cart 직접 수정 — 대여 중", isErrorNote: true,
          error: {
            code: "rusty/mutation-through-ref",
            message: "`cart` 현재 읽기 전용으로 빌려진 상태라 수정할 수 없습니다.",
            errorLine: 3, errorToken: "cart",
            relatedLine: 2, relatedToken: "ref", relatedLabel: "`cart` ref()로 빌린 지점",
            fixes: [],
          } },
      ],
    },
    {
      id: "double-mut",
      label: "mut 이중 대여",
      rule: "rusty/double-mut-borrow",
      raw: [
        `const total = { amount: 0, count: 0 };`,
        `const a = mut(total);`,
        `const b = mut(total);`,
      ],
      html: [
        `<span class="kw">const</span> total = { amount: 0, count: 0 };`,
        `<span class="kw">const</span> a = <span class="fn-mut tok-flag">mut</span>(<span class="tok-flag">total</span>);`,
        `<span class="kw">const</span> b = <span class="fn-mut tok-flag">mut</span>(<span class="tok-flag">total</span>);`,
      ],
      steps: [
        { active: -1, vars: [], note: "실행 전" },
        { active: 0, vars: [{ n: "total", s: "owned" }], note: "total 소유" },
        { active: 1, vars: [{ n: "total", s: "mut" }], note: "mut(total) → total 쓰기 대여 (a)" },
        { active: 2, vars: [{ n: "total", s: "mut" }], note: "⛔ mut(total) 재시도 (b) — 이미 대여 중", isErrorNote: true,
          error: {
            code: "rusty/double-mut-borrow",
            message: "`total` 이미 mut 상태로 빌려진 상태입니다. 동시에 두 개의 mut 빌림을 가질 수 없습니다.",
            errorLine: 3, errorToken: "mut",
            relatedLine: 2, relatedToken: "mut", relatedLabel: "기존 mut 빌림 시작 지점",
            fixes: [],
          } },
      ],
    },
  ];

  const STATE_META = {
    owned: { label: "owned", color: "var(--owned)" },
    ref: { label: "ref", color: "var(--ref)" },
    mut: { label: "mut", color: "var(--mut)" },
    moved: { label: "moved", color: "var(--moved)" },
    alias: { label: "alias", color: "var(--alias)" },
  };

  const tabsEl = document.getElementById("tabs");
  const codeEl = document.getElementById("code");
  const narrationEl = document.getElementById("narration");
  const varsEl = document.getElementById("vars");
  const dotsEl = document.getElementById("dots");
  const termWrap = document.getElementById("terminal-wrap");
  const termEl = document.getElementById("terminal");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  const btnReset = document.getElementById("btn-reset");
  const btnPlay = document.getElementById("btn-play");

  let scenarioIdx = 0;
  let stepIdx = 0;
  let playTimer = null;

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; btnPlay.textContent = "▶"; }
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    SCENARIOS.forEach((sc, i) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(i === scenarioIdx));
      b.textContent = sc.label;
      b.addEventListener("click", () => { stopPlay(); scenarioIdx = i; stepIdx = 0; renderAll(); });
      tabsEl.appendChild(b);
    });
  }

  function renderCode() {
    const sc = SCENARIOS[scenarioIdx];
    const step = sc.steps[stepIdx];
    codeEl.innerHTML = "";
    sc.html.forEach((lineHtml, i) => {
      const row = document.createElement("div");
      row.className = "line";
      if (step.active === i) row.classList.add("is-active");
      if (step.error && step.error.errorLine - 1 === i) row.classList.add("is-error");
      if (step.error && step.error.relatedLine - 1 === i) row.classList.add("is-related");
      let gutter = "";
      if (step.error && step.error.errorLine - 1 === i) gutter = "⛔";
      else if (step.error && step.error.relatedLine - 1 === i) gutter = "•";
      else if (step.active === i) gutter = "▸";
      row.innerHTML = `<span class="num">${i + 1}</span><span class="gutter">${gutter}</span><span class="code-text">${lineHtml}</span>`;
      codeEl.appendChild(row);
    });
  }

  function renderVars() {
    const sc = SCENARIOS[scenarioIdx];
    const step = sc.steps[stepIdx];
    varsEl.innerHTML = "";
    if (!step.vars.length) {
      varsEl.innerHTML = `<p class="empty-hint">다음을 눌러 실행하세요</p>`;
      return;
    }
    step.vars.forEach((v) => {
      const meta = STATE_META[v.s];
      const card = document.createElement("div");
      card.className = "var-card";
      card.innerHTML = `<span class="var-name">${esc(v.n)}</span><span class="pill" style="background:${meta.color}">${esc(meta.label)}</span>`;
      varsEl.appendChild(card);
    });
  }

  function renderNarration() {
    const sc = SCENARIOS[scenarioIdx];
    const step = sc.steps[stepIdx];
    narrationEl.textContent = step.note;
    narrationEl.classList.toggle("is-error", !!step.isErrorNote);
  }

  function renderDots() {
    const sc = SCENARIOS[scenarioIdx];
    dotsEl.innerHTML = "";
    sc.steps.forEach((_, i) => {
      const b = document.createElement("button");
      b.className = "dot";
      b.setAttribute("aria-current", String(i === stepIdx));
      b.setAttribute("aria-label", `${i + 1}단계로 이동`);
      b.addEventListener("click", () => { stopPlay(); stepIdx = i; renderAll(); });
      dotsEl.appendChild(b);
    });
  }

  function renderTerminal() {
    const sc = SCENARIOS[scenarioIdx];
    const step = sc.steps[stepIdx];
    if (!step.error) { termWrap.hidden = true; termEl.innerHTML = ""; return; }
    const e = step.error;
    const errRaw = sc.raw[e.errorLine - 1];
    const relRaw = sc.raw[e.relatedLine - 1];
    let html = `<div class="head"><span class="dot3"></span> error[${esc(e.code)}]</div>`;
    html += `<pre class="msg-line">${esc(e.message)}</pre>`;
    html += `<pre>${caretBlock(e.errorLine, errRaw, e.errorToken, "")}</pre>`;
    html += `<div class="note">note: ${esc(e.relatedLabel)}<pre>${caretBlock(e.relatedLine, relRaw, e.relatedToken, "")}</pre></div>`;
    if (e.fixes && e.fixes.length) {
      html += `<div class="help">도움말<ul>${e.fixes.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
    }
    html += `<div class="runtime-note">일반 JS라면 런타임까지 안 보였을 버그입니다.</div>`;
    termEl.innerHTML = html;
    termWrap.hidden = false;
  }

  function renderButtons() {
    const sc = SCENARIOS[scenarioIdx];
    btnPrev.disabled = stepIdx === 0;
    btnNext.disabled = stepIdx === sc.steps.length - 1;
  }

  function renderAll() {
    renderTabs();
    renderCode();
    renderVars();
    renderNarration();
    renderDots();
    renderTerminal();
    renderButtons();
  }

  function next() {
    const sc = SCENARIOS[scenarioIdx];
    if (stepIdx < sc.steps.length - 1) { stepIdx++; renderAll(); }
    else stopPlay();
  }
  function prev() { if (stepIdx > 0) { stepIdx--; renderAll(); } }
  function reset() { stopPlay(); stepIdx = 0; renderAll(); }

  btnNext.addEventListener("click", () => { stopPlay(); next(); });
  btnPrev.addEventListener("click", () => { stopPlay(); prev(); });
  btnReset.addEventListener("click", reset);
  btnPlay.addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    const sc = SCENARIOS[scenarioIdx];
    if (stepIdx >= sc.steps.length - 1) stepIdx = 0;
    btnPlay.textContent = "⏸";
    playTimer = setInterval(() => {
      const cur = SCENARIOS[scenarioIdx];
      if (stepIdx >= cur.steps.length - 1) { stopPlay(); return; }
      next();
    }, 1500);
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowRight") { stopPlay(); next(); }
    if (ev.key === "ArrowLeft") { stopPlay(); prev(); }
  });

  renderAll();
})();
</script>
</body>
</html>
